<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fdfafb"><title>餐厅管理 · 时光小屋</title><link rel="stylesheet" href="/js/cabin-next.css?v=6.2"></head><body><main class="food-admin-shell"><header class="food-admin-header"><a class="brand" href="/"><span class="brand-icon">♥</span>时光小屋</a><a class="secondary" href="/#kitchen">返回点餐页面 ↗</a></header><div class="page-heading"><div><p class="eyebrow">OUR LITTLE KITCHEN · CONTROL ROOM</p><h1>把每一份心意，好好接住。</h1><p class="muted">这里管理订单和菜单。前台只负责点餐和查看进度。</p></div></div><p id="food-admin-status" role="status" class="muted">正在检查管理员登录…</p><form id="food-admin-login" class="card food-admin-login" hidden><h2>管理员登录</h2><p class="muted">使用原来的后台密码，与小屋共享口令不同。</p><label for="food-admin-password">管理员密码</label><input id="food-admin-password" type="password" maxlength="128" autocomplete="current-password" required><button class="primary">进入餐厅管理 ↗</button></form><div id="food-admin-panel" hidden><div class="food-admin-toolbar"><div id="food-order-counts" class="muted"></div><div><button id="food-refresh" class="secondary">刷新订单</button><button id="food-admin-logout" class="text-button">退出管理</button></div></div><div class="subtabs" id="food-order-filters"><button class="active" data-status="all">全部订单</button><button data-status="pending">待接单</button><button data-status="cooking">正在做</button><button data-status="delivering">准备开饭</button><button data-status="completed">已完成</button></div><div id="admin-order-list" class="order-list"></div><details id="food-menu-management" class="card food-menu-management"><summary>菜单管理 · 添加或移除菜品</summary><form id="food-menu-form"><div class="food-menu-form-grid"><div><label for="dish-name">菜名</label><input id="dish-name" maxlength="50" required></div><div><label for="dish-emoji">菜品图标</label><input id="dish-emoji" maxlength="12" value="🍽" required></div><div><label for="dish-category">分类</label><input id="dish-category" maxlength="30" value="custom" required></div><div><label for="dish-price">展示价格（不产生付款）</label><input id="dish-price" type="number" min="0" max="9999" step="0.01" value="0" required></div></div><label for="dish-desc">菜品描述</label><textarea id="dish-desc" maxlength="160" rows="2"></textarea><button class="primary">添加到前台菜单</button></form><div id="admin-menu-list" class="food-admin-menu-list"></div></details><p class="muted food-admin-footnote">管理员登录有效期 8 小时。退出小屋或修改共享口令后，需要重新登录管理。</p><a href="/other/admin.html" class="text-button">其他高级设置 ↗</a></div></main><script src="/js/cabin-orders-admin.js?v=6.2" defer></script></body></html>
