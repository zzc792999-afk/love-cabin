<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>👨‍🍳 哲哲爱心大厨专属接单台 · 后厨指挥中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --chef-gold: #f9a826;
            --chef-gold-light: #ffd166;
            --chef-red: #e84a5f;
            --chef-blue: #00d4ff;
            --chef-green: #2ed573;
            --bg-dark: #16121e;
            --card-bg: rgba(32, 26, 42, 0.85);
            --border-glass: rgba(249, 168, 38, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #120d1a 0%, #1e1526 50%, #0d0913 100%);
            color: #fff;
            min-height: 100vh;
            padding: 15px 12px 90px 12px;
            position: relative;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* 顶部大厨看板 */
        .chef-header {
            background: linear-gradient(135deg, rgba(249, 168, 38, 0.15), rgba(232, 74, 95, 0.12));
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px 16px;
            backdrop-filter: blur(15px);
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .chef-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .chef-title {
            font-size: clamp(1.3rem, 4.2vw, 1.75rem);
            font-weight: 800;
            background: linear-gradient(90deg, #fff, #ffd166, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chef-desc {
            font-size: 0.82rem;
            color: rgba(255, 235, 240, 0.8);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 14px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }

        .stat-num {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--chef-gold);
        }

        .stat-label {
            font-size: 0.72rem;
            color: #aaa;
            margin-top: 2px;
        }

        /* 操作控制导航 */
        .control-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .control-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 15px;
            border-radius: 18px;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--chef-gold), #e84a5f);
            color: #1a0f20;
            border-color: #ffd166;
            box-shadow: 0 4px 15px rgba(249, 168, 38, 0.4);
        }

        /* 订单卡片 */
        .order-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 14px;
            backdrop-filter: blur(14px);
            position: relative;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s;
        }

        .order-card.pending {
            border-color: var(--chef-gold);
            background: linear-gradient(145deg, rgba(249, 168, 38, 0.12), rgba(32, 26, 42, 0.95));
        }

        .order-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .customer-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            color: #ff758c;
            font-size: 0.95rem;
        }

        .badge-status {
            font-size: 0.74rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .badge-pending { background: rgba(249, 168, 38, 0.25); color: #ffd166; border: 1px solid #ffd166; }
        .badge-cooking { background: rgba(255, 117, 140, 0.25); color: #ff758c; border: 1px solid #ff758c; }
        .badge-delivering { background: rgba(0, 212, 255, 0.25); color: #00d4ff; border: 1px solid #00d4ff; }
        .badge-completed { background: rgba(46, 213, 115, 0.25); color: #2ed573; border: 1px solid #2ed573; }

        .items-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .item-line {
            font-size: 0.88rem;
            color: #fff;
            margin: 4px 0;
            line-height: 1.4;
        }

        .item-spec {
            font-size: 0.74rem;
            color: #ffccd5;
            margin-left: 4px;
        }

        .order-meta {
            font-size: 0.8rem;
            color: #bbb;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .order-meta strong { color: #ffd166; }

        .actions-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .act-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .act-btn:active { transform: scale(0.95); }

        .act-btn.cook { background: rgba(249, 168, 38, 0.2); color: #ffd166; border-color: #ffd166; }
        .act-btn.deliver { background: rgba(0, 212, 255, 0.2); color: #00d4ff; border-color: #00d4ff; }
        .act-btn.done { background: rgba(46, 213, 115, 0.2); color: #2ed573; border-color: #2ed573; }
        .act-btn.del { background: rgba(231, 76, 60, 0.15); color: #ff6b6b; border-color: #ff6b6b; margin-left: auto; }

        /* 菜单管理面板 */
        .menu-manage-section {
            display: none;
        }

        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 9px 12px;
            color: white;
            font-size: 16px;
            outline: none;
            margin-top: 4px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        .dish-admin-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .floating-tools {
            position: fixed;
            bottom: calc(15px + env(safe-area-inset-bottom));
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(249, 168, 38, 0.9);
            color: #1a0f20;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部大厨专属看板 -->
        <div class="chef-header">
            <div class="chef-title-row">
                <div class="chef-title">👨‍🍳 哲哲爱心小厨房 · 接单台</div>
                <button class="act-btn" onclick="fetchOrders(true)" style="background: rgba(255,255,255,0.1); font-size: 0.78rem;">
                    <i class="fas fa-sync-alt" id="refresh-icon"></i> 刷新
                </button>
            </div>
            <p class="chef-desc">专属厨师长：陈祖哲 🐂 | 专属VIP顾客：白珊珊 🐰（终身免单）</p>

            <div class="stats-bar">
                <div class="stat-box">
                    <div class="stat-num" id="stat-pending">0</div>
                    <div class="stat-label">待接单 ⏳</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="stat-cooking" style="color: #ff758c;">0</div>
                    <div class="stat-label">烹饪中 🍳</div>
                </div>
                <div class="stat-box">
                    <div class="stat-num" id="stat-total" style="color: #2ed573;">0</div>
                    <div class="stat-label">今日总单 📦</div>
                </div>
            </div>
        </div>

        <!-- 导航标签 -->
        <div class="control-tabs">
            <button class="tab-btn active" onclick="switchTab('orders-all')"><i class="fas fa-list"></i> 全部订单</button>
            <button class="tab-btn" onclick="switchTab('orders-pending')">⏳ 待处理</button>
            <button class="tab-btn" onclick="switchTab('orders-active')">🔥 烹饪/配送中</button>
            <button class="tab-btn" onclick="switchTab('menu-manage')"><i class="fas fa-utensils"></i> 菜品上架与管理</button>
        </div>

        <!-- 订单列表容器 -->
        <div id="orders-list-container">
            <!-- 动态渲染订单 -->
        </div>

        <!-- 菜单管理模块 -->
        <div class="menu-manage-section" id="menu-manage-container">
            <div class="form-card">
                <h3 style="color: var(--chef-gold); font-size: 1rem; margin-bottom: 10px;">➕ 上架大厨拿手新菜品</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px;">
                    <div>
                        <label style="font-size: 0.72rem; color: #aaa;">菜品名称：</label>
                        <input type="text" id="in-name" placeholder="如: 哲哲爱心炒面" class="form-input">
                    </div>
                    <div>
                        <label style="font-size: 0.72rem; color: #aaa;">图标 Emoji：</label>
                        <input type="text" id="in-emoji" placeholder="如: 🍜 或 🍗" class="form-input">
                    </div>
                    <div>
                        <label style="font-size: 0.72rem; color: #aaa;">菜品分类：</label>
                        <select id="in-cat" class="form-input" style="height: 40px;">
                            <option value="breakfast">🍳 元气早餐</option>
                            <option value="main">🍲 招牌大餐</option>
                            <option value="night">🍢 深夜夜宵</option>
                            <option value="drinks">🧋 特调饮品</option>
                            <option value="desserts">🍰 治愈甜品</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 0.72rem; color: #aaa;">支付代币（价格）：</label>
                        <input type="text" id="in-price" placeholder="如: 亲亲 1 次 💋" class="form-input">
                    </div>
                    <div>
                        <label style="font-size: 0.72rem; color: #aaa;">专属标签：</label>
                        <input type="text" id="in-tag" placeholder="如: 招牌 / 爆款" class="form-input">
                    </div>
                </div>
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 0.72rem; color: #aaa;">食材与口感介绍：</label>
                    <input type="text" id="in-desc" placeholder="写一句让珊珊流口水的诱人介绍..." class="form-input">
                </div>
                <button class="act-btn cook" style="width: 100%; justify-content: center; padding: 10px;" onclick="addDish()">
                    <i class="fas fa-plus"></i> 确认上架菜品
                </button>
            </div>

            <h3 style="color: #fff; font-size: 0.95rem; margin-bottom: 10px;">📋 当前在售菜品清单</h3>
            <div class="menu-grid" id="menu-items-grid">
                <!-- 动态渲染菜品 -->
            </div>
        </div>
    </div>

    <!-- 悬浮工具栏 -->
    <div class="floating-tools">
        <a href="takeout.html" class="tool-btn" title="查看珊珊点餐前台" target="_blank"><i class="fas fa-store"></i></a>
        <a href="../index.html" class="tool-btn" title="返回小屋首页" style="background: rgba(255,255,255,0.2); color: white;"><i class="fas fa-home"></i></a>
    </div>

    <script>
        let allOrders = [];
        let allMenu = [];
        let currentTab = 'orders-all';
        let lastOrderCount = 0;

        // 声音提示（使用 Web Audio API 合成可爱的叮咚提示音）
        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(587.33, now); // D5
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.4);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(880, now + 0.15); // A5
                gain2.gain.setValueAtTime(0.4, now + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now + 0.15);
                osc2.stop(now + 0.7);
            } catch(e) {}
        }

        function init() {
            fetchOrders();
            fetchMenu();
            setInterval(fetchOrders, 4000);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const ordersList = document.getElementById('orders-list-container');
            const menuManage = document.getElementById('menu-manage-container');

            if (tab === 'menu-manage') {
                ordersList.style.display = 'none';
                menuManage.style.display = 'block';
                fetchMenu();
            } else {
                ordersList.style.display = 'block';
                menuManage.style.display = 'none';
                renderOrders();
            }
        }

        function fetchOrders(manual = false) {
            const icon = document.getElementById('refresh-icon');
            if (icon) icon.classList.add('fa-spin');

            fetch('/api/food/orders')
                .then(res => res.json())
                .then(orders => {
                    if (icon) icon.classList.remove('fa-spin');
                    allOrders = orders || [];
                    
                    // 如果有新订单，播放提示音
                    if (allOrders.length > lastOrderCount && lastOrderCount > 0) {
                        playChime();
                    }
                    lastOrderCount = allOrders.length;

                    updateStats();
                    if (currentTab !== 'menu-manage') renderOrders();
                    if (manual) alert('✨ 订单已同步刷新！');
                })
                .catch(() => {
                    if (icon) icon.classList.remove('fa-spin');
                });
        }

        function updateStats() {
            const pending = allOrders.filter(o => o.status === 'pending').length;
            const cooking = allOrders.filter(o => o.status === 'cooking' || o.status === 'delivering').length;
            
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-cooking').innerText = cooking;
            document.getElementById('stat-total').innerText = allOrders.length;
        }

        function renderOrders() {
            const container = document.getElementById('orders-list-container');
            container.innerHTML = '';

            let filtered = allOrders;
            if (currentTab === 'orders-pending') {
                filtered = allOrders.filter(o => o.status === 'pending');
            } else if (currentTab === 'orders-active') {
                filtered = allOrders.filter(o => o.status === 'cooking' || o.status === 'delivering');
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #888; padding: 50px;">暂无该状态下的订单，大厨哲哲可以休息一下~ ☕</div>';
                return;
            }

            filtered.forEach(order => {
                const card = document.createElement('div');
                card.className = `order-card ${order.status}`;

                let badgeHtml = '';
                if (order.status === 'pending') badgeHtml = '<span class="badge-status badge-pending">⏳ 待接单</span>';
                else if (order.status === 'cooking') badgeHtml = '<span class="badge-status badge-cooking">🍳 烹饪中</span>';
                else if (order.status === 'delivering') badgeHtml = '<span class="badge-status badge-delivering">🚴 正在火速投喂</span>';
                else if (order.status === 'completed') badgeHtml = '<span class="badge-status badge-completed">💖 投喂已完成</span>';

                const itemsHtml = (order.items || []).map(i => `
                    <div class="item-line">
                        • <strong>${i.emoji} ${i.name}</strong>
                        <span class="item-spec">[${i.spicy} | ${i.temp} ${i.services && i.services.length ? ' | ' + i.services.join(' ') : ''}]</span>
                        ${i.note ? `<div style="color: #ffd166; font-size: 0.72rem; margin-left: 12px;">备注: ${i.note}</div>` : ''}
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="order-top">
                        <div class="customer-tag"><i class="fas fa-heart"></i> 🐰 白珊珊宝贝的订单</div>
                        <div>${badgeHtml}</div>
                    </div>

                    <div class="items-box">${itemsHtml}</div>

                    <div class="order-meta">
                        <div>🕒 <strong>下单时间：</strong> ${new Date(order.timestamp).toLocaleString()}</div>
                        <div>📍 <strong>送达地点：</strong> ${order.address || '卧室被窝里'}</div>
                        <div>💰 <strong>支付代币：</strong> ${order.payMethod || '亲亲一口 💋'}</div>
                        ${order.notes ? `<div>💌 <strong>珊珊留言：</strong> <span style="color: #ffd166;">${order.notes}</span></div>` : ''}
                    </div>

                    <div class="actions-group">
                        <button class="act-btn cook" onclick="updateOrderStatus('${order.id}', 'cooking')">
                            <i class="fas fa-fire"></i> 接单烹饪
                        </button>
                        <button class="act-btn deliver" onclick="updateOrderStatus('${order.id}', 'delivering')">
                            <i class="fas fa-biking"></i> 出锅配送
                        </button>
                        <button class="act-btn done" onclick="updateOrderStatus('${order.id}', 'completed')">
                            <i class="fas fa-check-circle"></i> 投喂完成
                        </button>
                        <button class="act-btn del" onclick="deleteOrder('${order.id}')" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateOrderStatus(id, status) {
            fetch('/api/food/orders', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status })
            })
            .then(res => res.json())
            .then(() => fetchOrders());
        }

        function deleteOrder(id) {
            if (!confirm('确定要删除这条订单吗？')) return;
            fetch('/api/food/orders?id=' + id, { method: 'DELETE' })
                .then(res => res.json())
                .then(() => fetchOrders());
        }

        // 菜单管理
        function fetchMenu() {
            fetch('/api/food/menu')
                .then(res => res.json())
                .then(menu => {
                    allMenu = menu || [];
                    renderMenu();
                });
        }

        function renderMenu() {
            const grid = document.getElementById('menu-items-grid');
            if (!grid) return;
            grid.innerHTML = '';

            allMenu.forEach(dish => {
                const card = document.createElement('div');
                card.className = 'dish-admin-card';
                card.innerHTML = `
                    <div>
                        <div style="font-weight: 700; font-size: 0.88rem; color: #fff;">${dish.emoji || '🍲'} ${dish.name}</div>
                        <div style="font-size: 0.72rem; color: #ff9ebb;">${dish.price || '亲亲1次'} | ${dish.tag || '哲哲拿手'}</div>
                    </div>
                    <button style="background: transparent; border: none; color: #ff6b6b; cursor: pointer; padding: 4px;" onclick="deleteDish('${dish.id}')">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function addDish() {
            const name = document.getElementById('in-name').value.trim();
            const emoji = document.getElementById('in-emoji').value.trim() || '🍲';
            const category = document.getElementById('in-cat').value;
            const price = document.getElementById('in-price').value.trim() || '亲亲 1 次 💋';
            const tag = document.getElementById('in-tag').value.trim() || '大厨手作';
            const desc = document.getElementById('in-desc').value.trim() || '哲哲用心为您烹饪的美味~';

            if (!name) { alert('请输入菜品名称！'); return; }

            const newDish = {
                id: 'dish_' + Date.now(),
                name, emoji, category, price, tag, desc,
                available: true
            };

            fetch('/api/food/menu', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newDish)
            })
            .then(res => res.json())
            .then(() => {
                alert('🎉 菜品【' + name + '】已成功上架！');
                document.getElementById('in-name').value = '';
                document.getElementById('in-emoji').value = '';
                document.getElementById('in-price').value = '';
                document.getElementById('in-tag').value = '';
                document.getElementById('in-desc').value = '';
                fetchMenu();
            });
        }

        function deleteDish(id) {
            if (!confirm('确定要下架这道菜品吗？')) return;
            fetch('/api/food/menu?id=' + id, { method: 'DELETE' })
                .then(res => res.json())
                .then(() => fetchMenu());
        }

        init();
    </script>
</body>
</html>
