<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>恋爱足迹地图 · 哲哲 🐂 ✕ 珊珊 🐰</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #190a28;
            --rose-gold: #ffcad4;
            --pink-accent: #f4acb7;
            --glass-bg: rgba(255, 229, 236, 0.08);
            --glass-border: rgba(255, 202, 212, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: linear-gradient(135deg, #1f0b2e, #331545, #11061c);
            color: white; min-height: 100vh; padding: 20px 15px 100px 15px; position: relative;
        }

        .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 10; }

        .header-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 30px 20px; text-align: center;
            backdrop-filter: blur(16px); margin-bottom: 25px;
        }

        .header-card h1 {
            font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 800;
            background: linear-gradient(90deg, #fff, var(--rose-gold), var(--pink-accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .map-wrapper {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 20px; backdrop-filter: blur(12px);
            position: relative; min-height: 400px; display: flex;
            flex-direction: column; gap: 15px;
        }

        .pin-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }

        .pin-card {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,202,212,0.2);
            border-radius: 16px; padding: 15px; cursor: pointer; transition: transform 0.3s;
        }

        .pin-card:hover { transform: translateY(-4px); border-color: var(--pink-accent); }

        .pin-title { font-size: 1.05rem; font-weight: 800; color: var(--rose-gold); margin-bottom: 4px; }
        .pin-desc { font-size: 0.8rem; color: rgba(255,230,240,0.75); }

        .back-btn {
            position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: 20px;
            width: 48px; height: 48px; border-radius: 50%; background: rgba(255,229,236,0.15);
            border: 1px solid rgba(255,202,212,0.3); backdrop-filter: blur(10px);
            color: white; display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 1.2rem; z-index: 100;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <h1>🗺️ 哲哲 🐂 ✕ 珊珊 🐰 恋爱足迹地图</h1>
            <p>记录我们一起走过的城池、打卡过的美食与浪漫梦想点位</p>
        </div>

        <div class="map-wrapper">
            <div style="text-align: center; font-size: 1.1rem; font-weight: 800; color: var(--rose-gold); margin-bottom: 10px;">
                📍 路线节点回顾
            </div>
            <div class="pin-list">
                <div class="pin-card" onclick="alert('📍 【初次相遇点位】\n2024-05-03 · 命运开始交织的地方 🌸')">
                    <div class="pin-title">📍 初次相遇之城</div>
                    <div class="pin-desc">2024-05-03 · 故事的起点</div>
                </div>

                <div class="pin-card" onclick="alert('📍 【重新牵手点位】\n2026-01-18 · 确定彼此心意，开启甜蜜新篇章 💍')">
                    <div class="pin-title">📍 复合重新牵手地</div>
                    <div class="pin-desc">2026-01-18 · 浪漫重启</div>
                </div>

                <div class="pin-card" onclick="alert('📍 【甜蜜美食打卡】\n和小兔一起干饭的最幸福时刻 🍲')">
                    <div class="pin-title">📍 美食打卡大本营</div>
                    <div class="pin-desc">小牛看着小兔大快朵颐</div>
                </div>

                <div class="pin-card" onclick="alert('📍 【未来旅行大本营】\n约定好以后要一起看遍这世界的繁华与宁静 ✈️')">
                    <div class="pin-title">📍 未来看世界之地</div>
                    <div class="pin-desc">梦想旅途 · 敬请期待</div>
                </div>
            </div>
        </div>
    </div>

    <a href="../index.html" class="back-btn" title="返回主页"><i class="fas fa-home"></i></a>

</body>
</html>
