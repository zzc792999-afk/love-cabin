<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>时光慢递信箱 · 哲哲 🐂 ✕ 珊珊 🐰</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #190a28;
            --rose-gold: #ffcad4;
            --pink-accent: #f4acb7;
            --glass-bg: rgba(255, 229, 236, 0.08);
            --glass-border: rgba(255, 202, 212, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at center, #2e1438 0%, #170924 70%, #0a0412 100%);
            color: white; min-height: 100vh; padding: 20px 15px 100px 15px; position: relative;
        }

        .container { max-width: 850px; margin: 0 auto; position: relative; z-index: 10; }

        .header-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 30px 20px; text-align: center;
            backdrop-filter: blur(16px); margin-bottom: 25px;
        }

        .header-card h1 {
            font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 800;
            background: linear-gradient(90deg, #fff, var(--rose-gold), var(--pink-accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-card p { font-size: 0.88rem; color: rgba(255, 230, 240, 0.8); margin-top: 5px; }

        .capsules-list { display: flex; flex-direction: column; gap: 20px; }

        .capsule-item {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 22px; backdrop-filter: blur(12px);
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px;
        }

        .capsule-info h3 { font-size: 1.2rem; font-weight: 800; color: var(--rose-gold); margin-bottom: 4px; }
        .capsule-info p { font-size: 0.85rem; color: rgba(255, 230, 240, 0.75); }

        .seal-badge {
            background: linear-gradient(135deg, var(--pink-accent), var(--rose-gold));
            color: #2b1836; font-weight: 800; padding: 10px 22px; border-radius: 20px;
            font-size: 0.88rem; cursor: pointer; border: none;
            box-shadow: 0 4px 15px rgba(244,172,183,0.4);
            transition: transform 0.2s;
        }

        .seal-badge:active { transform: scale(0.95); }

        .back-btn {
            position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: 20px;
            width: 48px; height: 48px; border-radius: 50%; background: rgba(255,229,236,0.15);
            border: 1px solid rgba(255,202,212,0.3); backdrop-filter: blur(10px);
            color: white; display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 1.2rem; z-index: 100;
        }

        #toast-popup {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: linear-gradient(135deg, rgba(244, 172, 183, 0.95), rgba(255, 202, 212, 0.95));
            color: #2b1836; padding: 12px 26px; border-radius: 30px; font-weight: 800;
            font-size: 0.9rem; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 99999;
            opacity: 0; transition: all 0.4s ease; pointer-events: none; text-align: center; max-width: 90vw;
        }
        #toast-popup.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <h1>📮 哲哲 🐂 ✕ 珊珊 🐰 时光慢递信箱</h1>
            <p>封存给未来的慢递时光胶囊，不到指定时间绝不拆封</p>
        </div>

        <div class="capsules-list">
            <!-- 胶囊 1 -->
            <div class="capsule-item">
                <div class="capsule-info">
                    <h3>💌 慢递胶囊 #1 · 给第 500 天的我们</h3>
                    <p>解封日期：2027年6月2日 · 倒计时进行中...</p>
                </div>
                <button class="seal-badge" onclick="clickSealedCapsule(1, '500天')">🔒 火漆封印中</button>
            </div>

            <!-- 胶囊 2 -->
            <div class="capsule-item">
                <div class="capsule-info">
                    <h3>💌 慢递胶囊 #2 · 给第 1000 天的我们</h3>
                    <p>解封日期：2028年10月14日 · 倒计时进行中...</p>
                </div>
                <button class="seal-badge" onclick="clickSealedCapsule(2, '1000天')">🔒 火漆封印中</button>
            </div>

            <!-- 胶囊 3 -->
            <div class="capsule-item">
                <div class="capsule-info">
                    <h3>💌 慢递胶囊 #3 · 给第 3000 天的我们 (终极远航)</h3>
                    <p>解封日期：2034年4月6日 · 倒计时进行中...</p>
                </div>
                <button class="seal-badge" onclick="clickSealedCapsule(3, '3000天')">🔒 火漆封印中</button>
            </div>
        </div>
    </div>

    <div id="toast-popup"></div>
    <a href="../index.html" class="back-btn" title="返回主页"><i class="fas fa-home"></i></a>

    <script>
        function clickSealedCapsule(idx, daysText) {
            const toast = document.getElementById('toast-popup');
            toast.innerText = `📮 【时光慢递信箱】\n该胶囊为给第 ${daysText} 的加密小作文！\n目前还在时光火漆封印中，时间到了才可以拆开哦 💖`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3800);
        }
    </script>
</body>
</html>
